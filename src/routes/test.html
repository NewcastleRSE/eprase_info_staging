<html>
	<head>
		<title>Bubbles Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900" rel="stylesheet">
    <style>
      /* 1. Register the custom properties so CSS can animate them */
      @property --color1 {
        syntax: '<color>';
        initial-value: #2C3E50;
        inherits: true;
      }
      @property --color2 {
        syntax: '<color>';
        initial-value: #BDC3C7;
        inherits: true;
      }
      body {margin: 0; padding: 0; background: #fff;}
      #topnav { height: 150px; display: flex; align-items: center; padding-left: 20px; }
      #dots {
        box-sizing: border-box;
        position: relative;
        width: 100%;
        height: 75vh;
        margin: 0;
        background-color: #eff3fb;
        border-top: 1px solid #eee;
        border-bottom: 1px solid #eee;
        overflow: hidden;
        display: flex;
        align-items: center; /* Centers text vertically */

        /* Subtle glowing edges */
        box-shadow: 
          inset 0 0 60px rgba(34, 61, 152, 0.1), /* Inner blue glow */
          0 0 2px rgba(0, 0, 0, 0.1);           /* Soft outer shadow */
        
      }

      .banner-text {
        font-family: "Raleway", sans-serif;
        font-optical-sizing: auto;
        font-weight: 200;
        color: #474747;
        font-style: normal;
        font-size: 4rem;
        z-index: 10;
        pointer-events: none;
        padding-left: 5%;
        position: relative;
        display: flex;
        text-shadow: 
          0 0 10px rgba(52, 152, 219, 0.2), 
          0 0 20px rgba(255, 255, 255, 0.3);
      }
      
      .ball {
        position: absolute;
        top: 0;
        left: 0;
        border-radius: 100px; 
        opacity: 0.2;
        /*filter:blur(4px);*/
        transition: 
          --color1 3s ease, 
          --color2 3s ease,
          border-radius 3s ease, 
          width 3s ease, 
          height 3s ease; /* Transition the colors, not the background string */
        background: linear-gradient(90deg, var(--color1) 50%, var(--color2) 50%);
        z-index: 5;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.1); /* Extremely subtle outline */
        will-change: transform, opacity, width, height, border-radius;
      }

      .ball.tablet {
        border-radius: 50%;
        /*filter:blur(3px);*/
      }

      /* The Scored Line (Pseudo-element) */
      .ball::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 0;
        width: 100%;
        height: 4px;
        
        background: var(--color1); 
        mix-blend-mode: multiply;
        opacity: 0;
        transition: opacity 3s ease;
        transform: translateY(-50%);
        pointer-events: none;
        /* This line inherits the rotation of the parent .ball */
      }

      .ball.tablet::after {
        opacity: 0.3;
        transition: opacity 2s ease; 
        transition-delay: 1s;
      }

      .ball:not(.tablet)::after {
        opacity: 0;
        transition: opacity 1s ease;
      }
      @media (max-width: 768px) {
        .banner-text {
          font-size: 3rem;
        }
      }
    </style>
	</head>
	<body>
    <div id="topnav">
      <img src="eprase_logo.png" alt="EPRASE Logo" style="height: 80px; margin: 10px;">
    </div>
		<div id="dots">
			<div class="banner-text">Configuring e-prescribing<br>systems to keep<br>patients safe</div>
		</div>
</body>

<script>
 window.addEventListener('load', function() {
  const container = document.getElementById("dots");
  const colors = ["#2C3E50", "#3498DB", "#16A085", "#218C74"];
  const capMap = {
    "#2C3E50": "#95a5a6", // Slate -> Light Grey
    "#3498DB": "#D1D9E6", // Blue -> Soft Blue/Grey
    "#16A085": "#A3E4D7", // Green -> Pale Mint
    "#218C74": "#BDC3C7"  // Emerald -> Silver
  };
  let balls = []; 
  let animationId;

  const minBlur = 1.75;
  const maxBlur = 6;
  const blurRange = maxBlur - minBlur;
  const minSize = 40;  // The 'Deep Background' size
  const maxSize = 90;  // The 'Foreground' size
  const sizeRange = maxSize - minSize;
  const midSize = (maxSize + minSize) / 2;
  const amplitude = sizeRange / 2;
  const minOp = 0.3;
  const maxOp = 0.55;

  let blurVal = minBlur;
  let depthOpacity = maxOp;
  let initialThrust = 1;

  function setup() {
    // 1. Clear existing balls from the DOM and the array
    container.querySelectorAll('.ball').forEach(b => b.remove());
    balls = [];
    cancelAnimationFrame(animationId);

    // 2. Determine Responsive Boundaries
    const cw = container.clientWidth;
    const ch = container.clientHeight;
    
    // If screen is narrow (mobile), use 20%, otherwise 33%
    const isMobile = cw < 768 ? true : false;
    const wallRatio = isMobile ? 0.20 : 0.33;
    let numBalls = isMobile ? 6 : 12; // Fewer balls on smaller screens
    const leftWall = cw * wallRatio;

    // 3. Create new balls for the new space
    for (let i = 0; i < numBalls; i++) {
      const ball = document.createElement("div");
      ball.classList.add("ball");
      const startPhase = (i / numBalls) * Math.PI * 2;
      const size = minSize + Math.random() * sizeRange;

      // --- DEPTH OF FIELD MATH ---
      const isForeground = size > 60; // Arbitrary threshold for "close" vs "far"
      const zIndex = isForeground ? 15 : 5; // Closer pills should be above farther ones
      ball.style.zIndex = zIndex;

      // tablets less blurry, need to see the center groove
      const isTablet = Math.random() > 0.7;

      let pW, pH;
      const pillColor = colors[Math.floor(Math.random() * colors.length)];
      const color2 = capMap[pillColor] || "#BDC3C7"; // Fallback just in case
      // Set initial variable values
      ball.style.setProperty('--color1', pillColor);
      ball.style.setProperty('--color2', color2);

      if (isTablet) {
        ball.classList.add("tablet");
        pW = size;
        pH = size;
        ball.style.borderRadius = "50%"; // Round tablet
        ball.style.setProperty('--color2', pillColor);
      } else {
        // Capsules (Pill-shaped)
        pW = size * 2.2;
        pH = size;
        ball.style.borderRadius = "100px";
      }
      //const pW = size * 2.2;
      //const pH = size;

      ball.style.width = `${pW}px`;
      ball.style.height = `${pH}px`;

      // Spawn safely in the new playground
      const startX = leftWall + Math.random() * (cw - leftWall - pW);
      const startY = Math.random() * (ch - size);

      //ball.style.background = colors[Math.floor(Math.random() * colors.length)];
      container.appendChild(ball);

      balls.push({
        el: ball,
        x: startX,
        y: startY,
        baseSize: size,
        baseVx: (Math.random() - 0.5) * initialThrust, // Large/close move fast, small/distant move slow
        baseVy: (Math.random() - 0.5) * initialThrust,
        w: pW,
        visualW: pW,
        h: pH,
        colorIndex: colors.indexOf(pillColor),
        phase: startPhase,
        pulseSpeed: 0.002,
        rotation: Math.random() * 360,
        rotationSpeed: (Math.random() - 0.5) * 0.4
      });
    }
    
    // Start moving
    move();
  }

  function move() {
    const cw = container.clientWidth;
    const ch = container.clientHeight;
    const wallRatio = cw < 768 ? 0.20 : 0.33;
    const wall = cw * wallRatio;
    
    balls.forEach(b => {
      let hit = false;

      if(b.w !== b.visualW) {
        // If the ball is currently morphing, we need to adjust its position to keep it centered
        const morphSpeed = 2;
        if(b.w < b.visualW) {
          b.w = Math.min(b.w + morphSpeed, b.visualW);
        } else {
          b.w = Math.max(b.w - morphSpeed, b.visualW);
        }
      }

      // Physics boundaries
      // --- HORIZONTAL HIT ---
      if (b.x + b.w >= cw) {
        b.x = cw - b.w;
        b.baseVx *= -1;
        hit = true;
      } else if (b.x <= wall) {
        b.x = wall;
        b.baseVx *= -1;
        hit = true;
      }

      // --- VERTICAL HIT ---
      if (b.y + b.h >= ch) {
        b.y = ch - b.h;
        b.baseVy *= -1;
        hit = true;
      } else if (b.y <= 0) {
        b.y = 0;
        b.baseVy *= -1;
        hit = true;
      }

      // --- COLOR SWAP ON HIT ---
      if (hit) {
        b.colorIndex = (b.colorIndex + 1) % colors.length;
        const newColor = colors[b.colorIndex];

        const shouldMorph = Math.random() < 0.3;

        if(shouldMorph) {
          const isNowTablet = !b.el.classList.contains('tablet');
          b.el.classList.toggle('tablet');
          b.visualW = isNowTablet ? b.baseSize : b.baseSize * 2.2;
        }

        b.el.style.width = `${b.visualW}px`;
        b.el.style.height = `${b.h}px`;

        const isTablet = b.el.classList.contains('tablet');
        if (isTablet) {
          b.el.style.borderRadius = "50%";
          b.el.style.setProperty('--color1', newColor);
          b.el.style.setProperty('--color2', newColor); // Melt both halves to the same color
        } else {
          b.el.style.borderRadius = "100px";
          const color2 = capMap[newColor] || "#BDC3C7";
          b.el.style.setProperty('--color1', newColor);
          b.el.style.setProperty('--color2', color2); // Melt to new two-tone pairing
        }
      }

      //current size and scale
      b.phase += b.pulseSpeed;
      const effectiveSize = midSize + Math.sin(b.phase) * amplitude; // Pulses between 40 and 80 for more dramatic effect
      const currentScale = effectiveSize / b.baseSize;

      //update speed  
      const speedMult = (effectiveSize / 90) * 0.6 + 0.4; // Recalculate speed multiplier based on pulsing size
      b.x += b.baseVx * speedMult;
      b.y += b.baseVy * speedMult;
      b.rotation += b.rotationSpeed;

      //update blur
      const isTablet = b.el.classList.contains('tablet');
      let blurVal = ((maxSize - effectiveSize) / sizeRange) * maxBlur + minBlur;
      if (isTablet) blurVal *= 0.85; // Tablets are sharper overall, so reduce blur by 50%
      
      //dynamic opacity
      const dynamicOpacity = ((effectiveSize - minSize) / sizeRange) * (maxOp - minOp) + minOp;
      b.el.style.opacity = dynamicOpacity;
      b.el.style.filter = `blur(${blurVal}px)`;
      b.el.style.transform = `translate(${b.x}px, ${b.y}px) scale(${currentScale}) rotate(${b.rotation}deg)`;
    });
    
    animationId = requestAnimationFrame(move);
  }

  // --- The Resize "Re-shuffler" ---
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    // Wait 200ms after user stops dragging to reset
    resizeTimer = setTimeout(setup, 200); 
  });

  setup(); // Initial run

});
</script>
